[project]
name = "rage"
version = "0.1.0"
description = "rage comic site feelsgood"
readme = "README.md"
authors = [
    { name = "Gurthog", email = "226201902+Gurthog@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

